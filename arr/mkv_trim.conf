# mkv_trim.conf — *arr integration settings for import.sh
# Edit this file to match your language preferences.

# Audio languages to keep (comma-separated ISO 639-2 codes)
AUDIO_LANGS="ukr,eng,jpn,und"

# Subtitle languages to keep (leave empty to remove all subtitles)
SUBTITLE_LANGS=""

# Track name score adjustments (pattern:score pairs, space-separated, case-insensitive)
# Negative scores exclude tracks; positive scores prefer them.
NAME_WEIGHTS="dub:100 orig:100 full:50 forced:50 mvo:50 много:50 профес:50 многог:50 полный:30 dvo:40 двух:40 vo:-40 одно:-50 sdh:-20 cc:-20 hi:-20 sign:-50 любит:-500 фандаб:-500 comment:-1000 director:-1000 described:-1000 описание:-1000 isolated:-1000 interview:-1000 Авторский:-1000 Гаврилов:-1000 Mono:-1000"

# Codec score adjustments (applies to both audio and subtitle tracks)
CODEC_WEIGHTS="TrueHD:7 DTS:5 AC3:4 SubStationAlpha:2 ass:2 srt:1"
